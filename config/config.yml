campaign:
  model: openai:gpt-5.6-luna  # every agent; null = $P2S_MODEL or the default
  reasoning_effort: null  # Agents 3-5; null keeps the provider default
  max_retry: 3
  use_images: true

inputs:  # the paper: a PDF (or --pdf), or the paper_graph.json of an earlier run
  pdf: null
  paper_graph: null  # e.g. runs/<run>/paper/paper_graph.json: skips the summarizer
  characterization: null  # folder of saved characterization reports: skips Agent 2

summarizer:  # Agent 1
  analyze_figures: true  # one vision call per figure region
  max_figures: 30

characterization:  # Agent 2: one agent per technique with evidence in the paper
  techniques: null  # e.g. [XRD, TEM]; null = every technique found
  include_stubs: false  # also run techniques whose spec is a stub
  reasoning_effort: high
  output_retries: 1

planning:
  max_plans: 3
  max_atoms: 5000

construction:  # the Construction agent: a pydantic-ai-harness Coder, one sandboxed workspace per attempt
  sandbox: bubblewrap  # bubblewrap (no network, writes only inside the workspace) or none
  network: false
  gpu: false  # expose GPUs to sandboxed scripts (network stays off); --gpu turns it on
  hide_paths: [.env, ~/.ssh, ~/.aws, ~/.netrc, ~/.config]  # unreadable inside the sandbox
  max_requests: 60  # model requests per Construction-agent run
  max_tool_calls: 150
  gate_retries: 2  # final reports the validation gate may send back before passing failures on
  code_timeout: 600.0  # seconds for the from-scratch replay of each final script
  memory_limit_gb: 16.0  # per replay; null disables the cap
  planning_tool: true  # harness Planning task list
  reminder_every: 10  # requests between reminders of the script contract; 0 disables
  delegation: false  # Coder delegate_task
  memory_dir: null  # harness Memory notebook kept across runs (e.g. runs/.construction_memory); null disables

validation:
  overlap_scale: 0.6
  close_contact_scale: 0.85
  anion_contact_scale: 1.3
  bond_scale: 1.2
  binding_scale: 1.5  # adsorbate-substrate contact: warn beyond (weakly bound)
  detached_scale: 2.0  # ... fail beyond (detached)
  charge_neutrality: false  # gate on zero net formal charge
  min_vacuum: 15.0
  bvs_warn: 0.30  # framework-cation bond-valence sum off by more than this warns
  bvs_fail: 0.40  # ... and by more than this fails
  bond_share_warn: 0.45  # one bond carrying more than this share of a cation's valence warns
  like_contact_warn: 0.8  # cation-cation / anion-anion pairs below this x covalent sum warn
  like_contact_fail: 0.7  # ... and below this fail
  molecule_bond_tol: 0.12  # A: molecules must match the RDKit conformer of their SMILES
  molecule_angle_tol: 20.0  # degrees

revision:
  read_scripts: true  # the Revision agent may read the build scripts

export:
  formats: [poscar]

overrides:
  model_type: null
  miller: null
  supercell: null
  lattice: null
  notes: []
