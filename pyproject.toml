[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2structure"
version = "0.1.0"
description = "Agentic workflow that turns experimental materials paper to simulation-ready atomistic structures"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ase",
    "pymatgen",
    "numpy",
    "pydantic",
    "pydantic-ai==2.59.0",
    "pydantic-ai-harness[coder]==0.59.0",
    "pyyaml",
    "pymupdf",
    "python-dotenv",
    "rdkit",
    "scipy",
    "spglib",
    "matplotlib",
    "nvalchemi-toolkit-ops==0.5.0",
    "torch==2.10.0",
    "warp-lang @ https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl",
]

[project.optional-dependencies]
test = ["pytest"]
app = ["starlette", "uvicorn", "python-multipart"]  # app/server.py, the web tool

[project.scripts]
paper-summarizer = "paper2structure.agents.summarizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["paper2structure*"]

[tool.setuptools.package-data]
paper2structure = ["agents/constructor/skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real LLM API (needs OPENAI_API_KEY)"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
