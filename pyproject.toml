[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2structure"
version = "0.1.0"
description = "Agentic workflow that turns your paper into a simulation-ready structure"
requires-python = ">=3.12"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "ase",
    "pymatgen",
    "numpy",
    "pydantic",
    "pydantic-ai==2.59.0",
    # Coder harness (file + shell tools, Skills, Planning, Memory, Bubblewrap sandbox); 0.x API, so pinned.
    # The sandbox also needs the `bwrap` binary: conda install -c conda-forge bubblewrap
    "pydantic-ai-harness[coder]==0.59.0",
    "pyyaml",
    "pymupdf",  # PDF text and figure extraction (summarizer)
    "python-dotenv",
    "rdkit",
    "scipy",
    "matplotlib",
    "nvalchemi-toolkit-ops==0.5.0",
    # CUDA 12 builds: the cluster's NVIDIA driver (550.x) supports CUDA <= 12.4, so the default
    # CUDA 13 wheels cannot reach the GPUs. Install with
    #   pip install -e . --extra-index-url https://download.pytorch.org/whl/cu126
    "torch==2.14.1+cu126",
    "warp-lang @ https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl",
]

[project.optional-dependencies]
test = ["pytest"]
app = ["starlette", "uvicorn", "python-multipart"]  # app/server.py, the web tool

[project.scripts]
paper-summarizer = "paper2structure.agents.summarizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["paper2structure*"]

[tool.setuptools.package-data]
paper2structure = ["agents/constructor/skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real LLM API (needs OPENAI_API_KEY)"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
